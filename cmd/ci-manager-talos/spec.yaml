name: ci-manager-talos
port: manager
version: v0.1.0
tagline: Converge the machine config of a declared node, and record what it changed.
why: |
  A cluster host is declared, never clicked. The engine that owns the cluster
  declares one machine config per node and this manager makes the node hold it,
  so a wiped box rebuilds from the same declaration and a second run finds
  nothing left to do.
tools:
  - name: reconcile
    does: Converge every declared node to its machine config and return who owns it.
example:
  tool: reconcile
  input: '{"manager":"talos","resources":[{"kind":"machine-config","name":"t0-controlplane","spec":{"node":"192.168.1.10","talosconfigEnv":"TALOSCONFIG","config":"version: v1alpha1\n"}}]}'
notes: |
  It knows one kind, `machine-config`. The resource name is the node's name in
  the declaration and `spec.node` is the address the manager reaches.
  `spec.config` is the machine config document, one document or several
  separated by a document marker. The client configuration comes from
  `spec.talosconfig` as a path, or from the variable `spec.talosconfigEnv`
  names, or from the variable the manager spec names, which defaults to
  TALOSCONFIG.

  Kept means the node already holds this config. The manager reads the config
  the node is running before it writes anything, loads both configs through the
  Talos config loader and asks the vendor for the patches that would carry the
  node's config to the declared one. No patch means Kept. The vendor keys every
  document by its apiVersion, kind and name, so the order of the documents
  never matters and the `version: v1alpha1` document may sit anywhere in the
  file. A reordered key, a reflowed line, a comment, a comment on a document
  separator and a defaulted field are not changes either. Two documents on the
  node that carry the same apiVersion, kind and name collapse into the last one,
  so a node holding a document twice answers Kept against a file holding it once.
  Did means the node held something else and the manager applied it. A read
  failure, a load failure or a patch failure is an error naming the action and
  the node. A document Talos does not know is a load failure, because a node
  would refuse it too.

  The loader runs with validation off, so it hands back a readonly unvalidated
  container. Such a container answers nil from `Machine` and `Cluster` and false
  from `CompleteForBoot`, because it never builds the v1alpha1 view. Only
  `Documents` is honest on it. Read a field off one of those providers and the
  answer is nil, not an error.

  A dry run reads the node exactly as a real run does and answers Kept either
  way, with the text saying what it would apply. It writes nothing.

  There is no delete path. A node dropped from a declaration stays as it is.
  It refuses a resource recorded as owned by a different manager.

  The client configuration path is read from the environment at realize time
  and never written to state, actions or logs.
spec:
  - key: statePath
    type: string
    required: false
    means: Where to record what was converged. Omit it and nothing is recorded.
  - key: talosconfigEnv
    type: string
    required: false
    means: >-
      The environment variable holding the client configuration path a resource
      falls back to. Defaults to TALOSCONFIG.
  - key: applyMode
    type: string
    required: false
    means: >-
      How the node takes an applied config. `auto` reboots when the change needs
      it and compares against the config the node is running. `staged` writes the
      config for the next boot and compares against the config the node saved,
      because the running one is still the old one. Defaults to auto.
