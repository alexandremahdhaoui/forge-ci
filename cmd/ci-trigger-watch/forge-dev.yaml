name: ci-trigger-watch
type: generic
version: 0.1.5
description: Fingerprint the watched repos and say whether they moved.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
  tools:
    - name: declare
      description: Report the resources this trigger needs.
      input: DeclareInput
      output: DeclareOutput
    - name: poll
      description: Fingerprint the watched repos and say whether they moved.
      input: DeclareInput
      output: TriggerOutput
