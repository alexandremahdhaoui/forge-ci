name: ci-trigger-watch
port: trigger
version: v0.1.5
tagline: Fingerprint the watched repos and say whether they moved.
why: 'It is stateless. It reports a fingerprint and compares it to the one you hand it,

  so forge-ci keeps the history and the engine keeps none.


  An uncommitted edit counts as a move, which is what you want on a laptop.'
tools:
- name: declare
  does: Report the workflows that make the watch list true. None without spec.notify.
- name: poll
  does: Fingerprint the watched repos and compare with spec.previous.
example:
  tool: poll
  input: '{"spec":{"watch":["../my-repo"],"previous":""}}'
notes: 'The fingerprint covers each repo''s HEAD and whether it is dirty. It is order

  independent, so listing the same repos differently gives the same answer.'
spec:
- key: watch
  type: list of string
  required: true
  means: Directories to watch. Each must be a git repo.
- key: previous
  type: string
  required: false
  means: The last fingerprint. Omit it and the first look counts as changed.
- key: notify
  type: object
  required: false
  means: 'Declare the workflow that makes a watched repo report its own pushes. Nothing
    on GitHub starts a workflow in one repo when another moves, so a watched repo has
    to send a repository_dispatch and something has to put that workflow there. Omit
    this key and the engine declares nothing, which is what it did before. Keys: owner,
    factory, eventType and secret are required; workflow defaults to notify, branch
    to main, fromEnv to the secret name, runsOn (the dispatch job''s runner label)
    to ubuntu-latest and apiBaseURL (where the rendered workflow sends the dispatch)
    to the public API.'
