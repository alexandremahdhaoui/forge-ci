name: ci-compute-github
port: compute
version: v0.1.1
tagline: Own the pipeline's GitHub surface and run targets on Actions.
why: 'The workflows a pipeline runs on are part of the pipeline, so they must

  follow it: this engine templates every workflow file from its spec, declares

  it beside the Actions secrets and enablement it needs, and the manager

  realizes the lot at bootstrap and re-converges it on every apply. A

  hand-edited workflow drifts back to what the spec says.'
tools:
- name: declare
  does: Answer one converged file per owned workflow, one Actions secret per declared secret, and enablement for every workflow file.
- name: run
  does: Dispatch the runner workflow with a unique marker and the target script, correlate by the marker in the run name, and poll to conclusion.
example:
  tool: declare
  input: '{"spec":{"repo":"o/r","runner":{"name":"ci-runner","secret":"FORGE_CI_GITHUB_TOKEN"}}}'
notes: 'A remote run that concludes red is a run with status failed, never an

  error: an error means the machinery broke. The dispatched script is built

  through the same target-to-command mapping the local compute uses, every

  token single-quoted, with the revision''s member shas pinned first - and a

  dirty revision is refused outright, because a remote runner can never see

  uncommitted changes.


  Workflow content is templated from the spec; a workflows entry may instead

  carry verbatim `content:`, which wins. Three kinds exist: `command` (build

  the workspace, run a command, optionally push what it wrote), `fan-out`

  (repository_dispatch to every consumer on a tag) and `release` (tag and

  publish, fully generic).


  Everything this engine declares goes to its one manager, which must know

  the github kinds - route it to ci-manager-github.'
spec:
- key: repo
  type: string
  required: true
  means: The owner/name the workflows, secrets and runs live on.
- key: dir
  type: string
  required: false
  means: The repo checkout directory relative to the pipeline root. Defaults to the repo basename.
- key: apiBaseURL
  type: string
  required: false
  means: The GitHub API base. Defaults to the public API; tests point it at a fake.
- key: tokenEnv
  type: string
  required: false
  means: The environment variable holding the API token for the run tool. Defaults to GITHUB_TOKEN.
- key: ref
  type: string
  required: false
  means: The branch dispatches target and pushes land on. Defaults to main.
- key: setup
  type: list
  required: false
  means: 'Setup actions run first in every command workflow and the runner, each {uses, with}. The instance names its own toolchain actions; this engine renders whatever it is handed.'
- key: workspace
  type: object
  required: false
  means: 'The checkout preamble every command workflow and the runner share: bootstrapCommand (one verbatim command that stands the whole workspace up in the working directory, naming its own factory), toolchainScript (verbatim install block). Required once any command workflow or the runner exists. bootstrapCommand is always required; toolchainScript only when spec.container and spec.containerFile are both unset, because an image supplies the toolchain instead.'
- key: container
  type: string
  required: false
  means: 'The image every job that builds a workspace runs inside, so its tools arrive prebuilt and no install step is rendered. It replaces the toolchain install and not the checkout: an image carries tools, not members, so bootstrapCommand still runs. Fan-out and release jobs never take one - they build no workspace. Empty runs on the runner itself, which is what a factory that PUBLISHES an image needs: a pipeline running inside the image it builds could not publish a fixed one after a bad release. Exactly one of container or containerFile may be set.'
- key: containerFile
  type: string
  required: false
  means: 'A file under the pipeline root holding the full image reference, tag included - the file a workspace sync generates from its resolved toolchain pin. The alternative to typing the pin into container: the workspace resolver owns the version and this engine only reads it at declare time, so a register-advanced pin reaches the rendered workflows on the next reconcile with nobody editing a pipeline file.'
- key: secrets
  type: list
  required: false
  means: The Actions secrets to seal, each with name and the fromEnv variable its value is read from (default GITHUB_TOKEN).
- key: workflows
  type: list
  required: false
  means: The owned workflows, each a kind with its parameters or verbatim content, plus an optional header comment block. A command workflow also takes reportFailure (open an issue when a run fails - set it on a workflow nobody watches, meaning a cron run or a repository_dispatch somebody fired from another repo), and pushBranches (also start on a push to this repo, which is how a factory pipeline reruns when its own workspace files change). Every command workflow serializes its own runs - one in flight, later starts queued rather than cancelled - because one push wave dispatches once per member, and concurrent applies race the state repo; this is the engine's guarantee, never a knob. A release workflow needs a secret too, because it stands the workspace up to reach the toolchain and that clone reaches private members.
- key: runner
  type: object
  required: false
  means: 'The run tool''s dispatch target: name, secret, setupScript (verbatim block before the targets), pollIntervalSeconds, timeoutMinutes. Without a name the engine cannot run substages.'
