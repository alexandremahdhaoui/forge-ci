name: ci-compute-github
kind: mcp-server
version: 0.1.0
description: Declare the pipeline's GitHub surface - workflow files, secrets, enablement - and run targets remotely through a dispatched runner workflow.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
runtime:
  env:
    - GITHUB_TOKEN
surface:
  tools:
    - name: declare
      description: Report every GitHub resource the spec implies.
      input: DeclareInput
      output: DeclareOutput
    - name: run
      description: Dispatch the runner workflow, correlate the run by marker, and poll it to conclusion.
      input: RunInput
      output: RunOutput
    - name: put
      description: Keep what a run built where this engine can serve it again.
      input: ArtifactPutInput
      output: ArtifactPutOutput
    - name: get
      description: Bring artifacts a put handed out back to paths under the root.
      input: ArtifactGetInput
      output: ArtifactGetOutput
