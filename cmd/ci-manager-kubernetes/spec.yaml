name: ci-manager-kubernetes
port: manager
version: v0.1.0
tagline: Converge a declared secret and a declared helm release in a cluster, and record what it changed.
why: |
  A run time credential is declared, never pasted. The declaration names the
  environment variable that carries each value and nothing else, so git holds
  no secret and a vault edit plus a rerun is the whole rotation. The manager
  reads the live secret first, so a rerun that changes nothing answers Kept.
tools:
  - name: reconcile
    does: Converge every declared secret and helm release, and return who owns it.
example:
  tool: reconcile
  input: '{"manager":"kubernetes","resources":[{"kind":"secret","name":"flux-deploy-key","spec":{"apiServer":"https://10.0.0.1:6443","namespace":"flux-system","name":"flux-deploy-key","data":{"identity":"FLUX_DEPLOY_KEY"}}}]}'
notes: |
  It knows two kinds, `secret` and `helm-release`, and it refuses any other by
  name.

  ## secret

  The resource name is the secret's name in the
  declaration. `spec.namespace` and `spec.name` are the namespace and the name
  in the cluster. `spec.data` maps each key of the secret to the name of the
  environment variable holding its value, never to the value itself, so a
  declaration is safe to commit and the values enter through the environment of
  one run. `spec.apiServer` is the API server the declaration expects.

  The declaration is read first and the cluster is confirmed after. A
  declaration that fails any check above is refused before `spec.apiServer` is
  read against the live cluster. A cluster that is not the one `spec.apiServer`
  names is an error carrying both, so a deploy key is never written into the
  wrong cluster.

  A key whose variable is unset or empty is an error naming the secret and the
  key. It never names the variable, because a person who pastes a value into
  `spec.data` by mistake pastes it where the variable name belongs, and echoing
  it would put the secret in the pipeline log. The key names the declaration, so
  it is enough to find the line to fix. A declaration carrying no `spec.data`, an
  empty map, a key with no name, and a key naming no variable are each an error
  naming what was seen.

  Kept or Did comes from one truncated hash. The manager takes SHA-256 over
  every key and its value, both length prefixed and in sorted order, keeps the
  first 12 characters, and writes it to the live secret under the annotation
  `forge-ci-secret-hash` in the same write that carries the data. The key set
  is hashed alongside the values, so dropping a key answers a different hash
  even when that key held nothing.

  Kept means the live secret carries that annotation already. Did on create
  means the cluster held no secret of that name. Did on update means the
  annotation named something else, and the write replaces the whole data map,
  so a key dropped from the declaration is gone from the secret. Nothing is
  merged, because a merge cannot prune. Every other field of the live secret
  is kept, so a label or an annotation someone else wrote survives.

  A dry run reads the live secret exactly as a real run does and answers Kept
  either way, with the text saying what it would write and which keys it would
  carry. It writes nothing. The key names travel into an action line and into
  every refusal. A declared value never travels into either one, whether it is
  the name of a variable or a secret somebody pasted where that name belongs.

  Force writes even when the annotation matches. Only a human asks for it, and
  it is the way to restore a secret someone edited in the cluster.

  There is no delete path. A secret dropped from a declaration stays as it is.
  It refuses a resource recorded as owned by a different manager.

  ## helm-release

  `spec.namespace` and `spec.name` are the namespace and the release name in
  the cluster. `spec.chart`, `spec.repository` and `spec.version` name the chart
  to install. `spec.values` is an optional map handed to the chart.
  `spec.createNamespace` is an optional bool. `spec.apiServer` is the API server
  the declaration expects. Every one of the others is required, and a missing one
  is an error naming the key.

  `spec.repository` is refused by name unless it starts with `oci://` or
  `https://`. `spec.version` is one exact chart version written as
  `major.minor.patch` with an optional leading `v`, so `2.13.0` and `v2.13.0`
  are both taken. A range such as `^2.13.0` or `2.13.x` is refused by name, so
  what a run installs is written in the declaration and nowhere else. The
  leading `v` is dropped before the version reaches the helm client and before
  it is compared to a live release, so a declaration of `v2.13.0` against a
  cluster holding `2.13.0` answers Kept and names no drift. A drift text prints
  the version the way the declaration wrote it, so an operator who wrote
  `v2.13.0` reads `v2.13.0` back.

  The declaration is read first and the cluster is confirmed after. A declaration
  that fails any check above is refused before `spec.apiServer` is read against
  the live cluster. A cluster that is not the one `spec.apiServer` names is an
  error carrying both. A declaration therefore says which cluster it belongs to,
  the same way a machine config names its node.

  Kept means the release exists and is healthy. It never means the release equals
  the declaration. A healthy release whose chart version differs answers Kept and
  names both versions in its text, and it is never upgraded, because Flux is the
  one writer of a release it already holds. A release in any status other than
  `deployed` is an error naming the status, so a pending or failed release is
  never retried blind. A release carrying a different chart is an error naming
  both charts.

  Did means the cluster held no release of that name and one was installed. An
  ordinary apply installs a missing release. It is not bootstrap only.

  A dry run reads the live release exactly as a real run does and answers Kept,
  with the text beginning `would install` when nothing is there. It writes
  nothing.

  The helm client is the helm go sdk. It reads one release from helm storage in
  the namespace and installs one there.

  ## the cluster

  The cluster it reaches comes from the standard client configuration
  resolution, so `KUBECONFIG`, the user's default configuration file and an
  in-cluster service account each work with nothing declared here.

  An install waits for the release to come up and gives up after ten minutes,
  so one reconcile blocks that long at most for each release it installs. The
  wait and its limit are fixed and nothing declares them.

  `spec.storage` picks where helm keeps its release records. It takes
  `secrets` or `memory`, and any other value is refused by name. Omit it and
  it is `secrets`. The manager reads no environment variable to decide this,
  because a manager runs as a grandchild process and an exported variable
  reaches it with nothing in git to read. An operator who exported `memory`
  would get a manager that installs into nothing and reports success, and a
  declaration is refused in review instead.
spec:
  - key: statePath
    type: string
    required: false
    means: Where to record what was converged. Omit it and nothing is recorded.
  - key: storage
    type: string
    required: false
    means: Where helm keeps its release records, `secrets` or `memory`. Omit it and it is `secrets`.
