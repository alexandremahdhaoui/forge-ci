name: ci-artifact-release
type: generic
version: 0.1.0
description: Tag every repo of a revision and publish a GitHub release.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
  tools:
    - name: declare
      description: Report the resources this release needs. It needs none.
      input: DeclareInput
      output: DeclareOutput
    - name: publish
      description: Tag every repo of the revision and create the release.
      input: ArtifactInput
      output: ArtifactOutput
