name: ci-artifact-release
port: artifact
version: v0.1.0
tagline: Tag every repo of a revision and publish a GitHub release.
why: 'The artifact port was specified and empty, so a pipeline could prove a revision

  and then publish nothing. This tags each member at the commit the revision names

  and attaches the binaries forge already built.'
tools:
- name: declare
  does: Report the resources this release needs. It needs none.
- name: publish
  does: Tag every repo of the revision and create the release.
example:
  tool: publish
  input: '{"revision":"3dd48e96ed7e","version":"v0.2.0","repos":{"golden-rust":"a5b26c6a"},"spec":{"root":".."}}'
notes: 'A dirty revision is refused. It was never proven, so releasing it publishes

  something nobody can reproduce.


  A tag that already exists is refused rather than moved, because a moved tag changes

  what a consumer already pinned.


  What uploads: every binary the runs built for a platform, read from the fields

  its record carries - the engine that built it said which OS and architecture,

  and the asset is named <name>_<os>_<arch> from those fields, never parsed from

  a file name. A record with no platform says nothing about where it runs and

  stays home; a container image or a URL is somebody else''s to serve. spec.assets

  globs add plain assets no record carries, which ride the release and stay out

  of the index.


  The release itself is ONE aggregated release per revision, tagged with the version

  the core decided, in the repo spec.repo names, carrying every upload plus index.json - the distribution

  index mapping the revision to the sha256 of each binary per platform, measured on

  the actual files. forge-factory sync consumes that index into the store. The

  dist tag is not semver on purpose, so a v* fan-out never fires for it.


  Tagging is plain git in each member checkout; the release itself is the GitHub

  REST API, spoken with the token named by spec.tokenEnv against spec.apiBaseURL,

  in the repo spec.repo names. There is no gh path: gh reads whatever token the

  host happens to carry, so it cannot be pointed at the credential the pipeline

  declared, and it is not in every image a job runs in.'
spec:
- key: repo
  type: string
  required: true
  means: Repo the release is created in, as owner/name. The workspace root is not a repo, so a release of the whole workspace belongs in the repo that holds its files. The pipeline names it rather than the engine reading it off a checkout's remote.
- key: root
  type: string
  required: false
  means: Directory holding the repos. Defaults to the working directory.
- key: apiBaseURL
  type: string
  required: false
  means: GitHub API base. Defaults to https://api.github.com; a fake in tests, a mirror in an airgap.
- key: tokenEnv
  type: string
  required: false
  means: Environment variable holding the token the release authenticates with. Defaults to GITHUB_TOKEN.
- key: assets
  type: list of strings
  required: false
  means: Root-relative globs of extra files to publish - the door for cross-built binaries no artifact record carries. A glob that matches nothing fails the release, because a distribution never shrinks silently.
- key: ignoreRepos
  type: list of strings
  required: false
  means: Members this release leaves alone. They stay in the revision, pinned at their shas, and are never tagged. That is what a factory holding a repo released elsewhere needs, and what a factory whose own pipeline writes into one of its members every run needs. The core reads it too, because the set that decides the version must be the set that gets tagged; every name must be a declared repo and must not repeat.
