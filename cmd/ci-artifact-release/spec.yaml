name: ci-artifact-release
port: artifact
version: v0.1.0
tagline: Tag every repo of a revision and publish a GitHub release.
why: 'The artifact port was specified and empty, so a pipeline could prove a revision

  and then publish nothing. This tags each member at the commit the revision names

  and attaches the binaries forge already built.'
tools:
- name: declare
  does: Report the resources this release needs. It needs none.
- name: publish
  does: Tag every repo of the revision and create the release.
example:
  tool: publish
  input: '{"revision":"3dd48e96ed7e","version":"v0.2.0","repos":{"golden-rust":"a5b26c6a"},"spec":{"root":".."}}'
notes: 'A dirty revision is refused. It was never proven, so releasing it publishes

  something nobody can reproduce.


  A tag that already exists is refused rather than moved, because a moved tag changes

  what a consumer already pinned.


  What uploads: every binary artifact the runs built, plus anything whose file name

  carries the name_os_arch platform suffix - a cross-built binary travels under that

  convention whatever engine produced it. A container image or a URL is somebody

  else''s to serve.


  The release itself is ONE aggregated release per revision, tagged dist-<revision>

  in the releaseIn repo, carrying every upload plus index.json - the distribution

  index mapping the revision to the sha256 of each binary per platform, measured on

  the actual files. forge-factory sync consumes that index into the store. The

  dist tag is not semver on purpose, so a v* fan-out never fires for it.


  The host''s gh CLI publishes when present; otherwise the GitHub REST API is spoken

  directly with the token named by spec.tokenEnv, against spec.apiBaseURL, and the

  repo is read off the releaseIn checkout''s own origin remote.'
spec:
- key: releaseIn
  type: string
  required: true
  means: Repo the release is created in. The workspace root is not a repo, so a release of the whole workspace belongs in the repo that holds its files.
- key: root
  type: string
  required: false
  means: Directory holding the repos. Defaults to the working directory.
- key: apiBaseURL
  type: string
  required: false
  means: GitHub API base for the gh-less path. Defaults to https://api.github.com; a fake in tests, a mirror in an airgap.
- key: tokenEnv
  type: string
  required: false
  means: Environment variable holding the token the gh-less path authenticates with. Defaults to GITHUB_TOKEN.
