name: ci-artifact-talos
kind: mcp-server
version: 0.1.0
description: Declare the machine config, the bootstrap and the secret bundle of one cluster, minted on a node in maintenance and read from the cluster after.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
layout:
  tools:
    - name: declare
      description: Report the machine config, the bootstrap and the secret bundle of one cluster.
      input: DeclareInput
      output: DeclareOutput
    - name: publish
      description: Refuse. This engine declares machine configs and never publishes.
      input: ArtifactInput
      output: ArtifactOutput
