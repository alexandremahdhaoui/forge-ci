name: ci-state-git
port: state
version: v0.1.4
tagline: Read and write CI state in a git repo, committing each record.
why: 'Git gives history, atomic writes, auth you already have and an audit trail, for

  nothing. It is a normal repo. Read it with `git log`.'
tools:
- name: declare
  does: Report the directories the state repo needs.
- name: get
  does: Read one record.
- name: put
  does: Write one record, commit it, and push it when the store has a remote.
- name: list
  does: List the keys under one kind.
example:
  tool: get
  input: '{"kind":"revision","key":"abc123","spec":{"path":"../my-state"}}'
notes: 'Kinds are `revision`, `run` and `owned`, plus any extras named in `spec.kinds`.

  A run key nests as `<revision>/<stage>/<substage>`, and `list` walks nested keys

  recursively.


  A key cannot escape the state root. `../../escape` lands inside it.


  A missing record is `found: false`, never an error. Nothing to commit is not an

  error either.'
spec:
- key: path
  type: string
  required: true
  means: The state repo. Created and initialised if it is not a repo yet.
- key: kinds
  type: list of string
  required: false
  means: Extra record kinds, each stored under a directory of its own name. This
    engine never learns what a caller stores in them.
- key: lfs
  type: list of string
  required: false
  means: Kinds whose payloads ride git LFS. Each named kind's directory gets a
    .gitattributes filter rule committed beside its first record, and the LFS
    filters are wired into the repo before the first add. Every name must be a
    declared kind, and the machine needs git-lfs installed. For records whose
    content only has to persist and verify by hash - a dependency lock, say -
    never to diff.
