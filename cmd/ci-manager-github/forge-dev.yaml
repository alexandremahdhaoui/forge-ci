name: ci-manager-github
kind: mcp-server
version: 0.1.0
description: Realize GitHub-side resources - converged workflow files, sealed Actions secrets, workflow enablement - from one token.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
runtime:
  env:
    - GITHUB_TOKEN
surface:
  tools:
    - name: reconcile
      description: Make the declared GitHub resources exist, and record what was made.
      input: ReconcileInput
      output: ReconcileOutput
