name: ci-artifact-kubernetes
kind: mcp-server
version: 0.1.0
description: Declare one cluster resource per entry of spec.resources, in list order, read from the gitops documents under the pipeline root.
openapi:
  specPath: ../../.forge/spec-cache/engines.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-ci/refs/heads/main
layout:
  tools:
    - name: declare
      description: Report one cluster resource per entry of spec.resources, in list order.
      input: DeclareInput
      output: DeclareOutput
    - name: publish
      description: Refuse. This engine declares cluster resources and never publishes.
      input: ArtifactInput
      output: ArtifactOutput
