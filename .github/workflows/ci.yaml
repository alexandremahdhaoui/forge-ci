name: forge-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install forge and mockery
        run: |
          go install github.com/alexandremahdhaoui/forge/cmd/forge@v0.42.0
          go install github.com/vektra/mockery/v3@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Create envrc
        run: touch .envrc

      - name: Configure git for the state engine
        run: |
          git config --global user.email "forge-ci@example.com"
          git config --global user.name "forge-ci"

      - name: forge test-all
        run: forge test-all
