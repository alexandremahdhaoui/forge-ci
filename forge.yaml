name: forge-ci

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: resolve-spec
    src: .
    engine: forge://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec spec/forge-ci.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec spec/engines.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec testdata/cases.json .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec testdata/cases.json
          .forge/spec-cache/revision &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec spec/revision.v1.yaml
          .forge/spec-cache/revision

  # Every engine generates its MCP surface. ci-state-git generates from
  # forge-revision-spec's schema, the same file forge-factory reads, so the
  # contract two tools share is the one the engine is built from. The rest
  # generate from forge-ci-spec's engines.v1.yaml.
  #
  # No version is pinned here and one would be ignored. forge resolves its own
  # engines at the version of the forge binary running, deliberately, so the
  # engines always match the forge that calls them. Needs forge v0.44.2.
  - name: gen-ci-state-git
    src: ./cmd/ci-state-git
    engine: forge://forge-dev

  - name: gen-ci-manager-local
    src: ./cmd/ci-manager-local
    engine: forge://forge-dev

  - name: gen-ci-manager-dryrun
    src: ./cmd/ci-manager-dryrun
    engine: forge://forge-dev

  - name: gen-ci-manager-github
    src: ./cmd/ci-manager-github
    engine: forge://forge-dev

  - name: gen-ci-compute-github
    src: ./cmd/ci-compute-github
    engine: forge://forge-dev

  - name: gen-ci-trigger-watch
    src: ./cmd/ci-trigger-watch
    engine: forge://forge-dev

  - name: gen-ci-gate-manual
    src: ./cmd/ci-gate-manual
    engine: forge://forge-dev

  - name: gen-ci-promotion-all
    src: ./cmd/ci-promotion-all
    engine: forge://forge-dev

  - name: gen-ci-compute-local
    src: ./cmd/ci-compute-local
    engine: forge://forge-dev

  - name: gen-ci-artifact-release
    src: ./cmd/ci-artifact-release
    engine: forge://forge-dev

  - name: generate-mocks
    src: .
    engine: forge://generic-builder
    spec:
      command: mockery

  - name: generate-docs
    src: .
    engine: forge://generic-builder
    spec:
      command: go
      args: ["run", "./cmd/docgen"]

  - name: format-code
    src: .
    engine: forge://go-format

  - name: forge-ci
    src: ./cmd/forge-ci
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-manager-local
    src: ./cmd/ci-manager-local
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-manager-dryrun
    src: ./cmd/ci-manager-dryrun
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-manager-github
    src: ./cmd/ci-manager-github
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-compute-github
    src: ./cmd/ci-compute-github
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-compute-local
    src: ./cmd/ci-compute-local
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-state-git
    src: ./cmd/ci-state-git
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-artifact-release
    src: ./cmd/ci-artifact-release
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-trigger-watch
    src: ./cmd/ci-trigger-watch
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-gate-manual
    src: ./cmd/ci-gate-manual
    dest: ./build/bin
    engine: forge://go-build

  - name: ci-promotion-all
    src: ./cmd/ci-promotion-all
    dest: ./build/bin
    engine: forge://go-build

# The CLI as a first class run target. Every toolchain runnable declares
# forge-self-factory: the model has no exceptions.
run:
  - name: forge-ci
    src: ./cmd/forge-ci
    factory: git@github.com:alexandremahdhaoui/forge-self-factory.git

test:
  - name: lint
    runner: forge://go-lint

  - name: no-hardcoding
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/no-hardcoding.sh"]

  - name: standalone
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/standalone.sh"]

  - name: engine-docs
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/engine-docs.sh"]

  - name: unwired
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unwired.sh"]

  - name: architecture
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/architecture.sh"]

  - name: docs
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/docs-check.sh"]

  - name: unit
    runner: forge://go-test

  - name: integration
    runner: forge://go-test
    spec:
      tags: [integration]
      packages: [./test/integration/...]

  - name: conformance
    runner: forge://go-test
    spec:
      tags: [conformance]
      packages: [./test/conformance/...]

  - name: e2e
    runner: forge://go-test
    spec:
      tags: [e2e]
      packages: [./test/e2e/...]
      timeout: "15m"

  - name: coverage
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/coverage.sh", "90"]

factory:
  module: github.com/alexandremahdhaoui/forge-ci
  goVersion: "1.26.5"
  manifest: committed
