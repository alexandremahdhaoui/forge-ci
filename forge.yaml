name: forge-ci

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: resolve-spec
    src: .
    engine: go://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec spec/forge-ci.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec testdata/cases.json .forge/spec-cache

  - name: format-code
    src: .
    engine: go://go-format

  - name: forge-ci
    src: ./cmd/forge-ci
    dest: ./build/bin
    engine: go://go-build

test:
  - name: lint
    runner: go://go-lint

  - name: unit
    runner: go://go-test
