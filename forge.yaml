name: forge-ci

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: resolve-spec
    src: .
    engine: go://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec spec/forge-ci.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-ci-spec testdata/cases.json .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec testdata/cases.json
          .forge/spec-cache/revision &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec spec/revision.v1.yaml
          .forge/spec-cache/revision

  # ci-state-git generates its MCP surface from forge-revision-spec's schema.
  # The contract two tools read is the same file the engine is built from.
  # The version is pinned: the short form go://forge-dev resolves against this
  # repo's own git describe, which is forge-ci's version, not forge's.
  - name: gen-ci-state-git
    src: ./cmd/ci-state-git
    engine: go://github.com/alexandremahdhaoui/forge/cmd/forge-dev@v0.44.0

  - name: generate-mocks
    src: .
    engine: go://generic-builder
    spec:
      command: mockery

  - name: generate-docs
    src: .
    engine: go://generic-builder
    spec:
      command: go
      args: ["run", "./cmd/docgen"]

  - name: format-code
    src: .
    engine: go://go-format

  - name: forge-ci
    src: ./cmd/forge-ci
    dest: ./build/bin
    engine: go://go-build

  - name: ci-manager-local
    src: ./cmd/ci-manager-local
    dest: ./build/bin
    engine: go://go-build

  - name: ci-manager-dryrun
    src: ./cmd/ci-manager-dryrun
    dest: ./build/bin
    engine: go://go-build

  - name: ci-compute-local
    src: ./cmd/ci-compute-local
    dest: ./build/bin
    engine: go://go-build

  - name: ci-state-git
    src: ./cmd/ci-state-git
    dest: ./build/bin
    engine: go://go-build

  - name: ci-artifact-release
    src: ./cmd/ci-artifact-release
    dest: ./build/bin
    engine: go://go-build

  - name: ci-trigger-watch
    src: ./cmd/ci-trigger-watch
    dest: ./build/bin
    engine: go://go-build

  - name: ci-gate-manual
    src: ./cmd/ci-gate-manual
    dest: ./build/bin
    engine: go://go-build

  - name: ci-promotion-all
    src: ./cmd/ci-promotion-all
    dest: ./build/bin
    engine: go://go-build

test:
  - name: lint
    runner: go://go-lint

  - name: no-hardcoding
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/no-hardcoding.sh"]

  - name: standalone
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/standalone.sh"]

  - name: engine-docs
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/engine-docs.sh"]

  - name: unwired
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/unwired.sh"]

  - name: architecture
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/architecture.sh"]

  - name: docs
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/docs-check.sh"]

  - name: unit
    runner: go://go-test

  - name: integration
    runner: go://go-test
    spec:
      tags: [integration]
      packages: [./test/integration/...]

  - name: conformance
    runner: go://go-test
    spec:
      tags: [conformance]
      packages: [./test/conformance/...]

  - name: e2e
    runner: go://go-test
    spec:
      tags: [e2e]
      packages: [./test/e2e/...]
      timeout: "15m"

  - name: coverage
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/coverage.sh", "90"]

factory:
  module: github.com/alexandremahdhaoui/forge-ci
  goVersion: "1.26.5"
