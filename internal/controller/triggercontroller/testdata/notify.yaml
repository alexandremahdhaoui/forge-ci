# Tell a-factory that one moved. Nothing is built here.
#
# Generated by forge-ci from spec.watch. Edit the pipeline, not this file:
# every apply converges it back.
#
# A lone checkout of this repo has no siblings and no workspace files,
# because they are generated and gitignored. Building here is not possible
# and a workflow that tries is red forever.

name: notify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Tell a-factory to run the pipeline
        env:
          GH_TOKEN: ${{ secrets.A_TOKEN }}
        run: |
          gh api repos/an-owner/a-factory/dispatches \
            --field event_type=member-pushed \
            --field 'client_payload[repo]=${{ github.repository }}' \
            --field 'client_payload[sha]=${{ github.sha }}'
