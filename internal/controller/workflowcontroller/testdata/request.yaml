# The remote consumer's request door: a repository_dispatch of type
# admission-request files the request into the register's store, where the
# next pipeline run answers it under the same policy as everything else.
# A request is untrusted input whoever files it and however it arrives.
#
# UNEXERCISED: written where Actions cannot run. It needs the same
# FORGE_CI_GITHUB_TOKEN as intake. A consumer fires it with:
#
#   forge-register add go:github.com/x/pkg --reason "..." \
#     --dispatch <owner>/golden-register
name: request

on:
  repository_dispatch:
    types: [admission-request]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Restore the tool store
        id: tool-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tool-store-${{ runner.os }}-

      - name: Check out the workspace around this repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.FORGE_CI_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          go run github.com/alexandremahdhaoui/forge-factory/cmd/forge-factory@7d34e3e bootstrap git@github.com:alexandremahdhaoui/golden-factory.git .

      - name: Install the toolchain from the workspace
        run: |
          (cd forge && go install ./cmd/forge) || go install github.com/alexandremahdhaoui/forge/cmd/forge@latest
          (cd forge-factory && go install ./cmd/...)
          (cd forge-ci && go install ./cmd/...)
          (cd forge-register && go install ./cmd/...)
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: File the request
        env:
          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
          ECOSYSTEM: ${{ github.event.client_payload.ecosystem }}
          PACKAGE: ${{ github.event.client_payload.package }}
          TRACK: ${{ github.event.client_payload.track }}
          VERSION: ${{ github.event.client_payload.version }}
          REQUESTER: ${{ github.event.client_payload.requester }}
          REASON: ${{ github.event.client_payload.reason }}
        run: |
          cd golden-register
          forge-register add \
            ${TRACK:+--track "$TRACK"} \
            ${VERSION:+--version "$VERSION"} \
            ${REQUESTER:+--requester "$REQUESTER"} \
            --reason "$REASON" \
            "$ECOSYSTEM:$PACKAGE"

      - name: Name the tool store by its content
        id: tool-store-key
        if: always()
        run: |
          echo "key=$(find ~/.cache/forge -mindepth 1 -maxdepth 4 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "present=$([ -d ~/.cache/forge ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save the tool store
        if: always() && steps.tool-store-key.outputs.present == 'true' && steps.tool-store.outputs.cache-matched-key != format('tool-store-{0}-{1}', runner.os, steps.tool-store-key.outputs.key)
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ steps.tool-store-key.outputs.key }}

      - name: Say that the run failed
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          TITLE: "request is failing"
        run: |
          open=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100")
          if printf '%s' "$open" | grep -q "\"title\": *\"$TITLE\""; then
            echo "an issue is already open for this; not filing another"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
            -d "{\"title\":\"$TITLE\",\"body\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Nothing else reports this run, so it reports itself. Close this once a run goes green; a failure after that files a new one.\"}"
